[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-apple-darwin", "aarch64-apple-darwin"]
# Where to host releases
hosting = "github"
# Custom job (see .github/workflows/sign-artifacts.yml) that minisign-signs
# every release artifact after dist has announced/uploaded it.
post-announce-jobs = ["./sign-artifacts"]
# Custom job (see .github/workflows/publish-crates-io.yml) that runs
# `cargo publish`. cargo-dist has no built-in crates.io publisher, so this
# is wired in as an ordinary publish-jobs custom job instead.
publish-jobs = ["./publish-crates-io"]
