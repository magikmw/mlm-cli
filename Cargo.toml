[package]
name = "mlm"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
authors = ["Michał Walczak <mw@michalwalczak.eu>"]
description = "A quick CLI time tracker: log start/stop punches and notes, see your day/week status."
license = "EUPL-1.2"
readme = "README.md"
repository = "https://github.com/magikmw/mlm-cli"
keywords = ["time-tracking", "cli", "productivity", "timesheet"]
categories = ["command-line-utilities"]
# Internal planning/process artifacts — not useful to someone
# `cargo install`-ing the tool, just noise in the published package.
exclude = [
    "AGENTS.md",
    "NOTES.md",
    "PLAN.md",
    "plans/",
    ".githooks/",
    ".github/",
    "clippy.toml",
    "coverage-baseline.json",
    "cliff.toml",
    "dist-workspace.toml",
    "scripts/",
]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
env_logger = "0.11.11"
log = "0.4.34"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"

[dev-dependencies]
chrono-tz = "0.10.4"
tempfile = "3.27.0"

# cargo-binstall verifies release artifacts against this key; see SIGNING.md.
# The matching private key lives only as the MINISIGN_SECRET_KEY GitHub
# Actions secret, never in this repo.
[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWTNO3Iugq4ICzcJhLwnwtOT1T0evn7RYI0951dfE+IkEyRykSvv0V/n"

[profile.release]
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
