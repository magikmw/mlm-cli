# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# This project's history (50+ commits) predates any Conventional Commits
# discipline: some commits do use a `type: subject` / `type(scope): subject`
# prefix (feat, fix, docs, refactor, storage, review, ...), but most are
# free-form ("Implement Milestone N: ...", "Merge milestone-N: ...", "Add
# ..."). Rather than pretend this is a strict Conventional Commits repo,
# commits are grouped by prefix *when a recognizable one is present*, and
# everything else falls into a single "Other Changes" bucket via the
# catch-all `".*"` parser at the end of `commit_parsers`. This is pragmatic,
# not aspirational: going forward, using Conventional Commits prefixes will
# get commits sorted into the nicer named groups below for free.

[changelog]
# Used by `--prepend` to remove the previous header.
header_marker = "<!-- git-cliff: end of header -->"
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
header = """
# Changelog

All notable changes to this project are documented in this file.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}

"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = true
# An array of regex based postprocessors to modify the changelog.
postprocessors = []

[git]
# Parse commits according to the conventional commits specification, for the
# commits that happen to follow it — see the note at the top of this file.
conventional_commits = true
# Keep commits that don't parse as strict Conventional Commits; they still
# get bucketed by the catch-all parser below instead of being dropped.
filter_unconventional = false
# Don't require every commit to be conventional (most of this history isn't).
require_conventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
commit_preprocessors = [
    # Keep only the first paragraph — several commits here (especially the
    # "Merge milestone-N" ones) have long multi-paragraph bodies that are
    # useful in `git log` but too noisy for a changelog entry. A handful of
    # older commits also hard-wrapped their subject line itself across two
    # lines with no blank line in between; the second pattern rejoins those.
    { pattern = '(?s)^(.*?)\n\n.*$', replace = "${1}" },
    { pattern = '\n', replace = " " },
]
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = false
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups. Order matters: first match wins. The final
# ".*" entry is the "everything that isn't Conventional Commits" bucket.
commit_parsers = [
    # Internal process noise, never user-facing — skipped rather than
    # grouped. This repo's development used a milestone-implementation
    # + independent-adversarial-review + merge workflow; the review
    # commits and merge commits document *how* the code got written,
    # not what changed for someone using the tool. The early history
    # used several different conventions for this ("review: ...",
    # "docs(review): ...", "docs: ... review ...", plain "Add ...
    # review ..." with no prefix at all) rather than one consistent
    # prefix, so this matches on content, not just a leading token.
    { message = "(?i)adversarial review", skip = true },
    { message = "^Merge ", skip = true },
    { message = "(?i)^release v?\\d+\\.\\d+\\.\\d+", skip = true },
    { message = "^report:", skip = true },
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^docs?(\\(|:)", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
    { message = ".*", group = "<!-- 11 -->💼 Other Changes" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# An array of link parsers for extracting external references, and turning them into URLs, using regex.
link_parsers = []
# Include only the tags that belong to the current branch.
use_branch_tags = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# Process submodules commits
recurse_submodules = false
