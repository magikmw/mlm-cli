# cargo-deny config, used in two places.
#
# - scripts/prep_release.sh runs
#   `cargo deny --locked check advisories licenses`.
# - .github/workflows/deny.yml runs `check advisories` every week.

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "EUPL-1.2",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "allow"
