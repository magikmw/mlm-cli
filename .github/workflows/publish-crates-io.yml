name: Publish to crates.io

# Reusable workflow invoked by dist's generated release.yml as a
# `publish-jobs` custom job (see dist-workspace.toml). cargo-dist does not
# have a built-in crates.io publisher, so this job does the equivalent by
# hand: check out the tagged commit and run `cargo publish`.
#
# Requires a `CARGO_REGISTRY_TOKEN` repository secret containing a crates.io
# API token with publish rights for this crate.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crates-io:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set; cannot publish to crates.io." >&2
            exit 1
          fi
          cargo publish --locked
