name: Sign release artifacts

# Reusable workflow invoked by dist's generated release.yml as a
# `post-announce-jobs` custom job (see dist-workspace.toml). By the time this
# runs, the GitHub Release for the tag already exists with all platform
# archives (and dist-manifest.json) uploaded to it. This job downloads those
# assets, signs each of them with minisign, and uploads the resulting `.sig`
# files back to the same release so cargo-binstall (and humans) can verify
# them. See SIGNING.md for the full story.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  sign:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$REF_NAME" ]; then
            echo "Could not determine release tag from github.ref_name" >&2
            exit 1
          fi
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir artifacts \
            --skip-existing

      - name: Sign artifacts with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "MINISIGN_SECRET_KEY secret is not set; skipping signing." >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/signing.key"
          printf '%s' "$MINISIGN_SECRET_KEY" | base64 -d > "$key_file"
          trap 'rm -f "$key_file"' EXIT

          cd artifacts
          shopt -s nullglob
          for f in *; do
            case "$f" in
              *.sig|dist-manifest.json|sha256*|*.sha256) continue ;;
            esac
            echo "Signing $f"
            minisign -S -W -s "$key_file" -x "$f.sig" -m "$f"
          done

      - name: Upload signatures to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          shopt -s nullglob
          sigs=(*.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "No signatures produced" >&2
            exit 1
          fi
          gh release upload "${{ steps.tag.outputs.tag }}" "${sigs[@]}" \
            --repo "${{ github.repository }}" \
            --clobber
